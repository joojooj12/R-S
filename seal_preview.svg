<svg viewBox="0 0 120 120" width="240" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sealGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D6" />
      <stop offset="30%" stop-color="#E5BF77" />
      <stop offset="60%" stop-color="#B88438" />
      <stop offset="85%" stop-color="#8F5E1E" />
      <stop offset="100%" stop-color="#E1B76D" />
    </linearGradient>
    <radialGradient id="navyBg" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#14467E" />
      <stop offset="60%" stop-color="#0C3362" />
      <stop offset="100%" stop-color="#071E3A" />
    </radialGradient>
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>
  
  <!-- Outer Gold Border -->
  <circle cx="60" cy="60" r="58" fill="url(#navyBg)" stroke="url(#sealGoldGrad)" stroke-width="3" />
  <!-- Concentric Delicate Gold Beaded Ring -->
  <circle cx="60" cy="60" r="51" fill="none" stroke="url(#sealGoldGrad)" stroke-width="1.5" stroke-dasharray="3.5,2.5" opacity="0.85" />
  <circle cx="60" cy="60" r="45" fill="none" stroke="url(#sealGoldGrad)" stroke-width="0.75" opacity="0.6" />
  
  <!-- Monogram Initials R & S in Calligraphic Script -->
  <text x="60" y="73" 
        font-family="'Great Vibes', 'Alex Brush', 'Cinzel Decorative', 'Georgia', cursive, serif" 
        font-size="44" 
        font-weight="bold" 
        fill="url(#sealGoldGrad)" 
        text-anchor="middle" 
        filter="url(#sealShadow)">R&amp;S</text>
</svg>